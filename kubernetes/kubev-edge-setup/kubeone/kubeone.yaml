# KubeOne cluster on the kubev demo environment (kubev-cluster).
#
# KubeOne creates the control-plane VMs itself through the machine-controller
# KubeVirt provider - there is no VM manifest, no Helm chart and no IP planning
# in this repo any more. `controlPlane.nodeSets` is the whole control plane and
# `dynamicWorkers` is the whole worker fleet.
#
# Prerequisites live in infra/ and are applied by `just infra`. See README.md.
apiVersion: kubeone.k8c.io/v1beta2
kind: KubeOneCluster
name: kubev-k1-edge

versions:
  kubernetes: 1.34.7

# The kube-apiserver address. Both entries front the SAME gobetween pod
# (infra/helmfile.yaml), so there is one health-checked backend list
apiEndpoint:
  host: "10.77.33.21"
  port: 6443
  alternativeNames:
    - "172.25.0.200"

cloudProvider:
  external: true
  kubevirt:
    # Namespace in the infra cluster that holds the VMs, their DataVolumes and
    # the API load balancer.
    infraNamespace: kubermatic-virtualization
    zoneAndRegionEnabled: false
    # Turns on cloud-provider-kubevirt's LoadBalancer controller. A
    # `type: LoadBalancer` Service in THIS cluster then gets a mirror Service in
    # infraNamespace, which MetalLB gives an address from ippool-kubev
    # (10.77.33.20-10.77.33.50) - a real address on the lab LAN. That is how
    # Headlamp is exposed; see helmReleases at the end of this file.
    #
    # Unlike the DC variant, there is no KubeLB here: the edge box has no uplink
    # to a KubeLB management cluster, and MetalLB on the LAN is enough.
    loadBalancerEnabled: true

controlPlane:
  nodeSets:
    # One nodeSet, one replica. KubeOne names the VM <cluster>-<nodeSet>-<idx>,
    # so this is `kubev-k1-edge-cp-0` in namespace kubermatic-virtualization.
    - name: cp
      replicas: 1
      operatingSystem: ubuntu
      operatingSystemSpec:
        distUpgradeOnBoot: false
      ssh:
        username: ubuntu
        agentSocket: env:SSH_AUTH_SOCK
        bastion: "10.77.33.22"
        bastionUser: bastion
        publicKeys:
          - "ssh-rsa  tobi@loodse.com"
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPr/5cZnDdT136izQK7G/tE5td5hEX39znQpuvbgypk5 tobi@yanblack.tailbf56ad.ts.net"
      cloudProviderSpec:
        virtualMachine:
          #evictionStrategy: LiveMigrate
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - 10.77.33.1 #edge router
          providerNetwork:
            name: kubeovn
            vpc:
              name: ovn-cluster
              subnet:
                name: kubeone-demo-cp
          template:
            vcpus:
              cores: 2
            memory: 4Gi
            primaryDisk:
              osImage: "docker://quay.io/kubermatic-virt-disks/ubuntu:24.04-amd64"
              source: registry
              pullMethod: node
              size: "20Gi"
              # NOT the default StorageClass: longhorn cannot serve a raw block
              # device for a VM disk and the CDI import hangs forever.
              storageClassName: kubev-vms
              # RWO, not RWX: on this edge box kubev-vms
              storageAccessType: ReadWriteOnce

dynamicWorkers:
  - name: worker
    replicas: 1
    providerSpec:
      operatingSystem: ubuntu
      operatingSystemSpec:
        distUpgradeOnBoot: false
      sshPublicKeys:
        - "ssh-rsa  tobi@loodse.com"
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPr/5cZnDdT136izQK7G/tE5td5hEX39znQpuvbgypk5 tobi@yanblack.tailbf56ad.ts.net"
      cloudProviderSpec:
        # Unlike the control plane, KubeOne passes the worker spec through
        # verbatim - clusterName has to be set here.
        clusterName: kubev-k1-edge
        virtualMachine:
          #evictionStrategy: LiveMigrate

          # Same reason as the control plane above.
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - 10.77.33.1 #edge router
          providerNetwork:
            name: kubeovn
            vpc:
              name: ovn-cluster
              subnet:
                name: kubeone-demo-workers
          template:
            vcpus:
              cores: 2
            memory: 4Gi
            primaryDisk:
              osImage: "docker://quay.io/kubermatic-virt-disks/ubuntu:24.04-amd64"
              source: registry
              pullMethod: node
              size: "20Gi"
              storageClassName: kubev-vms
              # Same local-path RWO constraint as the control plane above, and
              # the same StorageProfile-driven Filesystem volumeMode.
              storageAccessType: ReadWriteOnce

# Charts KubeOne reconciles into the cluster on every `kubeone apply`, as
addons:
  enable: true
  path: ./addons

helmReleases:
  # Headlamp - workload UI for the cluster.
  # https://headlamp.dev  |  chart: https://kubernetes-sigs.github.io/headlamp/
  - chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    version: "0.45.0"
    releaseName: headlamp
    namespace: headlamp
    wait: true
    timeout: 5m
    values:
      - inline:
          # LoadBalancer here, NodePort in the DC variant - because on this box
          # the KubeVirt CCM has somewhere to put the address.
          service:
            type: LoadBalancer
            port: 80
            externalTrafficPolicy: Cluster
            # cloud-provider-kubevirt copies annotations verbatim onto the
            # mirror Service, which is the only reason MetalLB annotations work
            # from in here - MetalLB runs in the infra cluster, not this one.
            annotations:
              metallb.io/loadBalancerIPs: 10.77.33.23
              metallb.io/address-pool: ippool-kubev
          # Headlamp authenticates with a ServiceAccount token you paste into
          # the UI; `just headlamp` prints one. cluster-admin is deliberate for
          # a demo - scope it down with a read-only ClusterRole for anything
          # real, especially with the UI on the LAN.
          clusterRoleBinding:
            create: true
            clusterRoleName: cluster-admin
