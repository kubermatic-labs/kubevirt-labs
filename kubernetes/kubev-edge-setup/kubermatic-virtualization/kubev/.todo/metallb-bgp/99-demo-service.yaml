# Optional smoke test: a Service that takes an address from the BGP pool.
#
#   kubectl apply -f 99-demo-service.yaml
#   kubectl -n metallb-bgp-demo get svc            # EXTERNAL-IP from 10.77.34.0/24
#   just bgp-routes                                # in edge-network/ - router learned it
#   curl http://<EXTERNAL-IP>                      # from any LAN client
#
# Delete it again and the route should vanish from the router within seconds.
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-bgp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: metallb-bgp-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: metallb-bgp-demo
  annotations:
    # Without this the Service lands in the auto-assigning L2 pool instead.
    metallb.io/address-pool: bgp-pool
spec:
  type: LoadBalancer
  selector: { app: echo }
  ports:
    - port: 80
      targetPort: 8080
