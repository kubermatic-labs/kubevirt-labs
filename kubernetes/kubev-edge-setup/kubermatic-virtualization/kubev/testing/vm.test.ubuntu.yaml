apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  namespace: kubermatic-virtualization
  labels:
    kubevirt.io/vm: vm-ubuntu-24
  name: vm-ubuntu-24
spec:
  dataVolumeTemplates:
  - metadata:
      creationTimestamp: null
      name: vm-ubuntu-24
    spec:
      source:
        registry:
          pullMethod: node
          #url: docker://quay.io/kubermatic-virt-disks/ubuntu:22.04
          url: docker://quay.io/kubermatic-virt-disks/ubuntu:24.04-amd64
        #http:
        #  url: http://vm-image-registry.kube-system.svc/vms/ubuntu-22.04-2025-01-13.img
          #latest cloudimg
          #url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
      storage:
        # RWO, not RWX: kubev-vms is backed by rancher.io/local-path, whose
        # NodePath mode accepts only ReadWriteOnce / ReadWriteOncePod and
        # rejects anything else outright with
        #   "NodePath only supports ReadWriteOnce and ReadWriteOncePod
        #    (1.22+) access modes"
        # (rancher/local-path-provisioner v0.0.37 provisioner.go). The claim
        # then stays Pending forever. RWO is no loss here - the box is a
        # single node, so live migration is off the table either way.
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 15G
        storageClassName: kubev-vms
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm-ubuntu-24
    spec:
      affinity: {}
      architecture: amd64
      dnsConfig:
        nameservers:
        - 10.77.33.1 #FOG
      ##APEX PROD
      #dnsConfig:
      #  nameservers:
      #    - 10.16.105.250
      #dnsPolicy: ClusterFirst
      domain:
        cpu:
          cores: 2
        devices:
          disks:
          - disk:
              bus: virtio
            name: datavolumedisk
          - disk:
              bus: virtio
            name: cloudinitdisk
#          interfaces:
#          - bridge: {}
#            name: default
#          networkInterfaceMultiqueue: true
#        machine:
#          type: q35
        resources:
          limits:
            memory: 4G
          requests:
            memory: 4G
#      evictionStrategy: External
#      networks:
#      - name: default
#        pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - dataVolume:
          name: vm-ubuntu-24
        name: datavolumedisk
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            package_update: true
            packages:
              - qemu-guest-agent
            ssh_authorized_keys:
              - ssh-rsa  tobi@loodse.com
            runcmd:
              - [ systemctl, enable, --now, qemu-guest-agent ]
              - mkdir -p /root/.ssh
              - cp /home/ubuntu/.ssh/authorized_keys /root/.ssh/authorized_keys
        name: cloudinitdisk
