apiVersion: v1
kind: Namespace
metadata:
  name: vm-test
---
#apiVersion: instancetype.kubevirt.io/v1beta1
#kind: VirtualMachineInstancetype
#metadata:
#  name: standard-2
#  namespace: vm-test
#spec:
#  cpu:
#    guest: 2
#  memory:
#    guest: 8Gi
#---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  namespace: vm-test
  labels:
    kubevirt.io/vm: vm-ubuntu-24
  name: vm-ubuntu-24
spec:
  dataVolumeTemplates:
  - metadata:
      creationTimestamp: null
      name: vm-ubuntu-24
    spec:
      source:
        registry:
          pullMethod: node
          #url: docker://quay.io/kubermatic-virt-disks/ubuntu:22.04
          url: docker://quay.io/kubermatic-virt-disks/ubuntu:24.04-amd64
        #http:
        #  url: http://vm-image-registry.kube-system.svc/vms/ubuntu-22.04-2025-01-13.img
          #latest cloudimg
          #url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
      storage:
        accessModes:
        #- ReadWriteOnce
        - ReadWriteMany
        resources:
          requests:
            storage: 15G
        storageClassName: kubev-vms #FOG


  - metadata:
      creationTimestamp: null
      name: vm-ubuntu-24-data
    spec:
      source:
        blank: {}
      storage:
        accessModes:
        #- ReadWriteOnce
        - ReadWriteMany
        resources:
          requests:
            storage: 10G
        storageClassName: kubev-vms #FOG


  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm-ubuntu-24
    spec:
      affinity: {}
      architecture: amd64
      dnsConfig:
        nameservers:
        - 10.30.10.250 #FOG
      ##APEX PROD
      #dnsConfig:
      #  nameservers:
      #    - 10.16.105.250
      #dnsPolicy: ClusterFirst
      domain:
        cpu:
          cores: 2
        devices:
          disks:
          - disk:
              bus: virtio
            name: datavolumedisk
          - disk:
              bus: virtio
            name: datadisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - masquerade: {}
            name: default
        resources:
          limits:
            memory: 4G
          requests:
            memory: 4G
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - dataVolume:
          name: vm-ubuntu-24
        name: datavolumedisk
      - dataVolume:
          name: vm-ubuntu-24-data
        name: datadisk
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            package_update: true
            packages:
              - qemu-guest-agent
            ssh_authorized_keys:
              - ssh-rsa  tobi@loodse.com
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdvSKRBTinzP8U9pqnr/2JNsUs1wrmn95JwYoDTFCm7 tobi@yanm-lan.tosc.home              
            runcmd:
              - [ systemctl, enable, --now, qemu-guest-agent ]
              - mkdir -p /root/.ssh
              - cp /home/ubuntu/.ssh/authorized_keys /root/.ssh/authorized_keys
        name: cloudinitdisk
