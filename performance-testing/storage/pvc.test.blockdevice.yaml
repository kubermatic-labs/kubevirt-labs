apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fio-test-device
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 10Gi

  storageClassName: kubev-vms #FOG

---
apiVersion: v1
kind: Pod
metadata:
  name: fio-test-block-device-pod
spec:
  containers:
    - name: tooling
      image: quay.io/kubermatic-labs/kubeone-tooling
      imagePullPolicy: Always
      command:
        - "/bin/sh"
      args:
        - "-c"
        - "while true; do echo $(date): $(ls -lah /dev/xvda) >> /tmp/buffer; cat /tmp/buffer; sleep 5; done;"
      volumeDevices:
        - name: my-volume-dev
          devicePath: /dev/xvda
      securityContext:
        runAsUser: 0
  terminationGracePeriodSeconds: 2
  volumes:
    - name: my-volume-dev
      persistentVolumeClaim:
        claimName: fio-test-device