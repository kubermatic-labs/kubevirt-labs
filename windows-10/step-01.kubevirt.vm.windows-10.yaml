apiVersion: v1
kind: Namespace
metadata:
  name: vm-windows-10
---
apiVersion: v1
kind: Service
metadata:
  name: vm-windows-10
  namespace: vm-windows-10
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "windows-10.tobi.demo.kubermatic.io"
spec:
  ports:
  - name: rdp
    port: 3389
  selector:
    kubevirt.io/vm: vm-windows-10
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-windows-10-disk
  namespace: vm-windows-10
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: kubev-vms
  volumeMode: Block
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt.io/vm: vm-windows-10
  name: vm-windows-10
  namespace: vm-windows-10
spec:
  dataVolumeTemplates:
  - metadata:
      creationTimestamp: null
      name: vm-windows-10-iso
    spec:
      source:
        http:
          url: http://vm-image-registry.kube-system.svc/vms/win10-2026-02.iso
          #url: http://vm-image-registry.kube-system.svc/vms/win10-2026-02-07.iso
      storage:
        accessModes:
          - ReadWriteOnce
        # - ReadWriteMany
        resources:
          requests:
            storage: 15Gi
        storageClassName: kubev-vms
        #volumeMode: Filesystem
  #######

  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm-windows-10
        kubevirt.io/os: windows10
    spec:
      architecture: amd64
      dnsConfig:
        nameservers:
        - 8.8.8.8
      dnsPolicy: None
      domain:
        # --- CPU / Memory ---
        cpu:
          cores: 2 # Example value, adjust as needed
        resources:
          requests:
            memory: "4Gi" # Example value
          limits:
            memory: "4Gi" # Example value

        # --- Features (Crucial for Windows) ---
        features:
          acpi: {} # Standard Power Management
          apic: {} # Interrupt Controller
          smm: {}
          # Hyper-V enlightenments significantly improve performance
          hyperv:
            relaxed: {}
            vapic: {}
            vpindex: {}
            spinlocks:
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            tlbflush: {}
            frequencies: {}
            reenlightenment: {}
            ipi: {}
            runtime: {}
            reset: {}
            # vendorid: # Sometimes needed, e.g., vendorid: 'kubevirt'

        # --- Clock (align with Hyper-V) ---
        clock:
          utc: {}
          timer:
            # Use hyperv timer
            hpet:
              present: false
            hyperv: {}
            # pit / rtc often have 'catchup' tickPolicy
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup

        # --- Firmware (EFI is standard for Win10+) ---
        firmware:
          bootloader:
            efi:
              #Secure Boot + virtio disk (most likely problem)
              #
              #  Line 119: secureBoot: true combined with line 129: bus: virtio for the OS disk.
              #
              #  Virtio drivers are not signed for UEFI Secure Boot. Windows will not be able to see the disk during installation. Either:
              #  - Set secureBoot: false, or
              #  - Change the OS disk bus to sata for installation, then switch to virtio later after installing drivers

              secureBoot: true # Often needed unless drivers/OS are signed correctly
              # persistent: true # If you need to store EFI vars
          #serial: 28db06d2-e5a8-4f50-9b74-3012bccf9e0d
          #uuid: 5d307ca9-b3ef-428c-8861-06e72d69f223
        # --- Devices ---
        devices:
          disks:
            # OS Disk (using virtio is recommended for performance)
            - name: osdisk
              disk:
                #bus: virtio
                bus: sata
              bootOrder: 1
            # CD-ROM for Install ISO
            - name: installiso
              cdrom:
                bus: sata
              bootOrder: 2
            # CD-ROM for Virtio Drivers
            - name: virtiocd
              cdrom:
                bus: sata
              bootOrder: 3

          interfaces:
          # Network interface (masquerade is simple, bridge requires CNI setup)
          - name: default
            masquerade: { }
            model: e1000
            # model: virtio # Use virtio for performance after drivers are installed
            # model: e1000 # Your spec uses e1000, safer initial default if virtio drivers aren't available yet
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30

      # --- Volumes ---
      volumes:
      - name: osdisk
        persistentVolumeClaim:
          claimName: vm-windows-10-disk
      - name: installiso
        dataVolume:
          name: vm-windows-10-iso
      - containerDisk:
          image: quay.io/kubevirt/virtio-container-disk:v1.5.3
        name: virtiocd
