# The guest IP is the most-read field in the detail view, so the acronyms inside the
# KubeVirt interface struct are worth fixing too. The rest of the passthrough
# sub-objects (volumeStatus[], guestOSInfo.*, conditions[]) are left as kro emits them.
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/interfaces/items/properties/ipAddress/title
  value: IP Address
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/interfaces/items/properties/ipAddresses/title
  value: IP Addresses
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/interfaces/items/properties/mac/title
  value: MAC
