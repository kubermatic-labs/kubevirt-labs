# JSON Patch (RFC 6902) that stamps an OpenAPI `title` onto every LinuxVirtualMachine
# spec and status property. Apply with `just sc-titles` after `just sc-rgds`.
#
# WHY THIS FILE EXISTS
#   The KDP dashboard derives a form label from the property name only when the schema
#   carries no title:
#       lib/apis/service-objects/requests.ts   if (!property.title) property.title = toTitleCase(key)
#       components/service-object/detail/...   const label = schema?.title || toTitleCase(key)
#   Its toTitleCase() knows nothing about acronyms, so `os` renders as "Os", `sshPublicKey`
#   as "Ssh Public Key" and `vpc` as "Vpc". A title in the schema wins, and it is the only
#   knob that fixes the create form and the detail view at once.
#
#   kro cannot emit one. Its simple-schema marker allowlist (pkg/simpleschema/markers.go,
#   markerTypeFromString) is required / default / description / minimum / maximum /
#   validation / enum / immutable / pattern / uniqueItems / minLength / maxLength /
#   minItems / maxItems / listType / listMapKey. There is no `title=` in v0.9.3 or on
#   kro main, and an unknown marker makes kro reject the whole RGD. So the title has to be
#   painted onto the CRD kro generated, after the fact.
#
# WHY IT STICKS
#   kro only touches an existing CRD when pkg/graph/crd/compat reports a change, and that
#   comparator never looks at Title - so in steady state kro sees "no changes" and skips
#   the update entirely. Even when the RGD does change, kro sends a JSON *merge* patch of
#   the desired CRD, which merges objects rather than clearing absent keys.
#
#   The one case that loses the titles: a merge patch replaces `spec.versions` wholesale
#   because it is a list. So re-run `just sc-titles` after every `just sc-rgds`, which is
#   exactly how the recipes are chained.
#
# AFTER PATCHING the api-syncagent has to be restarted so it publishes a fresh
# APIResourceSchema carrying the titles - `just sc-agent-restart`.

- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/os/title
  value: OS
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/image/title
  value: Image
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/instanceType/title
  value: Instance Type
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/diskSize/title
  value: Disk Size
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/loadBalancerClass/title
  value: Load Balancer Class
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/sshPublicKey/title
  value: SSH Public Key
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/subnet/title
  value: Subnet
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/vpc/title
  value: VPC

