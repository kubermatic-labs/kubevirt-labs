            "defaultExpanded": true
          },
          "children": [
            "vm-row-1",
            "vm-row-2"
          ]
        },
        "vm-row-1": {
          "type": "FormRow",
          "props": {
            "columns": 2,
            "gap": "md"
          },
          "children": [
            "templateImageName",
            "instanceType"
          ]
        },
        "templateImageName": {
          "type": "SelectField",
          "props": {
            "label": "Template Image Name",
            "description": "Golden image PVC in kubermatic-virtualization to clone",
            "disabled": false,
            "placeholder": "Select a template image",
            "options": [
              {
                "value": "windows-10-golden",
                "label": "Windows 10 golden"
              }
            ],
            "value": {
              "$bindState": "/spec/templateImageName"
            },
            "checks": [
              {
                "type": "required",
                "message": "Template Image Name is required"
              }
            ],
            "validateOn": "blur"
          },
          "children": []
        },
        "instanceType": {
          "type": "SelectField",
          "props": {
            "label": "Instance Type",
            "description": "VM size. Windows requires u1.large or larger.",
            "disabled": false,
            "placeholder": "Select an instance type",
            "options": [
              {
                "value": "u1.large",
                "label": "U1 large"
              },
              {
                "value": "u1.xlarge",
                "label": "U1 xlarge"
              },
              {
                "value": "u1.2xlarge",
                "label": "U1 2xlarge"
              },
              {
                "value": "u1.4xlarge",
                "label": "U1 4xlarge"
              },
              {
                "value": "u1.8xlarge",
                "label": "U1 8xlarge"
              }
            ],
            "value": {
              "$bindState": "/spec/instanceType"
