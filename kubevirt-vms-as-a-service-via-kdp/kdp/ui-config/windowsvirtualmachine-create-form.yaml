            "columns": 2,
            "gap": "md"
          },
          "children": [
            "diskSize",
            "vm-spacer"
          ]
        },
        "diskSize": {
          "type": "SelectField",
          "props": {
            "label": "Disk Size",
            "description": "Size of the cloned system disk. Must be at least the 50Gi golden image size - a clone can grow but never shrink.",
            "disabled": false,
            "placeholder": "Select a disk size",
            "options": [
              {
                "value": "50Gi",
                "label": "50Gi"
              },
              {
                "value": "100Gi",
                "label": "100Gi"
              },
              {
                "value": "200Gi",
                "label": "200Gi"
              }
            ],
            "value": {
              "$bindState": "/spec/diskSize"
