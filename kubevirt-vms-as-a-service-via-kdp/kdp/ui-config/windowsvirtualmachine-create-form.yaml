    {
      "root": "main",
      "elements": {
        "main": {
          "type": "Stack",
          "props": {
            "direction": "column",
            "gap": "lg",
            "align": "stretch"
          },
          "children": [
            "title",
            "vm-section",
            "net-section"
          ]
        },
        "title": {
