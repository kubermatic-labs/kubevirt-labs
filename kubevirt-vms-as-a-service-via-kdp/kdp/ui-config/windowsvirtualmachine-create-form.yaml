          "children": [
            "vpc",
            "subnet"
          ]
        },
        "vpc": {
          "type": "TextField",
          "props": {
            "label": "VPC",
            "description": "VPC in this workspace to attach to",
            "disabled": false,
            "type": "text",
            "placeholder": "Enter VPC name",
            "value": {
              "$bindState": "/spec/vpc"
            },
            "checks": [
              {
                "type": "required",
                "message": "VPC is required"
              }
            ],
            "validateOn": "blur"
          },
          "children": []
        },
        "subnet": {
          "type": "TextField",
          "props": {
            "label": "Subnet",
            "description": "Subnet in this workspace to attach to",
            "disabled": false,
            "type": "text",
            "placeholder": "Enter subnet name",
            "value": {
              "$bindState": "/spec/subnet"
            },
            "checks": [
