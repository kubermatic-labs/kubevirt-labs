  prompts: "[\"Create a form for WindowsVirtualMachine. Use two sections: \\\"Virtual machine\\\" with templateImageName, instanceType and diskSize; and \\\"Networking and access\\\" with vpc, subnet and loadBalancerClass. Use the schema titles and descriptions as labels and helper text, and render enum fields as dropdowns. Important: do not invent or prefill any VPC name, subnet name or image name - vpc and subnet must default to an empty string so the user enters their own.\"]"
