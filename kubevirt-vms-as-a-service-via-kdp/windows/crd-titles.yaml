# JSON Patch (RFC 6902) that stamps an OpenAPI `title` onto every WindowsVirtualMachine
# spec and status property, so the KDP dashboard stops title-casing the property names
# into "Vpc" / "Ssh Public Key" / "Load Balancer I P".
#
# See linux/crd-titles.yaml for the full rationale: kro has no `title=` marker, the
# dashboard only derives a label when the schema has no title, and kro's CRD comparator
# ignores Title so the patch survives. Applied by `just sc-titles`.

- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/instanceType/title
  value: Instance Type
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/diskSize/title
  value: Disk Size
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/templateImageName/title
  value: Template Image Name
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/loadBalancerClass/title
  value: Load Balancer Class
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/subnet/title
  value: Subnet
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/vpc/title
  value: VPC

