---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: vpcs.kubev.k8c.io
spec:
  schema:
    apiVersion: v1alpha1
    kind: Vpc
    group: kubev.k8c.io
    types:
      staticRoutes:
        cidr: string
        nextHopIP: string
        policy: string
      vpcPeerings:
        remoteVpcRef: string
        localConnectIP: string
    spec:
      staticRoutes: "[]staticRoutes"
      vpcPeerings: "[]vpcPeerings"
      enableBfd: boolean | default=false
    status:
      # realName is the name of the kube-OVN Vpc the wrapper creates, always
      # "<namespace>-<name>". Subnets and VMs need it, so it is surfaced here.
      realName: ${vpc.status.realName}
      router: ${vpc.status.router}
      phase: ${vpc.status.phase}
      enableExternal: ${vpc.status.enableExternal}
    additionalPrinterColumns:
      - jsonPath: .metadata.creationTimestamp
        name: Age
        type: date
      - jsonPath: .status.phase
        name: Phase
        type: string
      - jsonPath: .spec.enableBfd
        name: BFD
        type: boolean
      - jsonPath: .status.router
        name: Router
        type: string

  resources:
    # KubeVirtualization's own namespaced wrapper API, not kubeovn.io directly. The
    # wrapper is what the KubeV dashboard lists, and it owns the kube-OVN Vpc it creates
    # (named "<namespace>-<name>"). Creating kubeovn.io objects directly, as this RGD
    # used to, leaves them invisible to that dashboard.
    - id: vpc
      template:
        apiVersion: virtualization.k8c.io/v1alpha1
        kind: VPC
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          # enableExternal is NOT set. It needs external gateway nodes (an
          # `ovn-external-gw-config` ConfigMap plus labelled nodes), which this cluster
          # does not have, so kube-ovn-controller rejects it every reconcile with
          # "no external gw nodes". Outbound comes from the Subnet's VpcEgressGateway.
          enableBfd: ${schema.spec.enableBfd}
          bfdPort:
            enabled: ${schema.spec.enableBfd}
            ip: 10.255.255.255
          vpcPeerings: ${schema.spec.vpcPeerings}
          staticRoutes: ${schema.spec.staticRoutes}
