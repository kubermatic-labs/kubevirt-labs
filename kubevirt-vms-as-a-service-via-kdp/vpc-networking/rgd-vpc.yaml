---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  # The name of the CRD will be 'compositevms.composition.kubevirt.io'
  # The API group will be 'composition.kubevirt.io'
  name: vpcs.kubev.k8c.io
spec:
  # 1. Define the schema for the new CompositeVM CRD
  schema:
    apiVersion: v1alpha1
    kind: Vpc
    group: kubev.k8c.io
    types:
      staticRoutes:
        cidr: string
        nextHopIP: string
        policy: string
      vpcPeerings:
        remoteVpc: string
        localConnectIP: string
    spec:
      staticRoutes: "[]staticRoutes"
      vpcPeerings: "[]vpcPeerings"
      externalSubnet: string | default=external description="Unused. Kept so existing objects still validate; outbound is handled by the Subnet's egressGateway."
      enableBfd: boolean | default=false
    status:
      router: ${vpc.status.router}
      enableExternal: ${vpc.status.enableExternal}
      bfdPort: ${vpc.status.bfdPort}
    additionalPrinterColumns:
      - jsonPath: .metadata.creationTimestamp
        name: Age
        type: date
      - jsonPath: .spec.enableBfd
        name: BFD
        type: boolean
      - jsonPath: .status.router
        name: Router
        type: string

  resources:
    # This resource creates the KubeVirt VirtualMachine
    - id: vpc
      template:
        apiVersion: kubeovn.io/v1
        kind: Vpc
        metadata:
          name: ${schema.metadata.name}
        spec:
          # enableExternal / extraExternalSubnets are NOT set. They need external gateway
          # nodes (an `ovn-external-gw-config` ConfigMap plus labelled nodes), which this
          # cluster does not have, so kube-ovn-controller rejects them every reconcile with
          # "no external gw nodes" and status.enableExternal stays false. Outbound is
          # provided by the VpcEgressGateway on each Subnet instead.
          enableBfd: ${schema.spec.enableBfd}
          bfdPort:
            enabled: ${schema.spec.enableBfd}
            ip: 10.255.255.255
          vpcPeerings: ${schema.spec.vpcPeerings}
          staticRoutes: ${schema.spec.staticRoutes}
          policyRoutes: []