# JSON Patch (RFC 6902) that stamps an OpenAPI `title` onto every Subnet spec and status
# property, so the KDP dashboard stops rendering "Vpc", "Cidr", "Nat Outgoing" and
# "V4available I Prange". See linux/crd-titles.yaml for the full rationale.
# Applied by `just sc-titles`.

- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/cidr/title
  value: CIDR
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/vpc/title
  value: VPC
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/natOutgoing/title
  value: NAT Outgoing
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/egressGateway/title
  value: Egress Gateway
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/egressExternalSubnet/title
  value: Egress External Subnet

# --- status ------------------------------------------------------------------
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/state/title
  value: State
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/conditions/title
  value: Conditions
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/realName/title
  value: Kube-OVN Name
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/vpcRealName/title
  value: Kube-OVN VPC Name
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/availableIPs/title
  value: Available IPs
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/phase/title
  value: Phase
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/egressGatewayReady/title
  value: Egress Gateway Ready
- op: add
  path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/egressGatewayExternalIP/title
  value: Egress Gateway External IP
