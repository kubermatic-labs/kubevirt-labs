---
# Cluster prerequisite, applied once - shared by every tenant's VpcEgressGateway.
#
# A custom kube-OVN VPC has no outbound path. `Subnet.spec.natOutgoing` only SNATs the
# default VPC (ovn-cluster) from the node, and `Vpc.spec.enableExternal` needs external
# gateway nodes (a `ovn-external-gw-config` ConfigMap plus labelled nodes) which this
# cluster does not have - it fails with "no external gw nodes".
#
# So each tenant subnet gets a VpcEgressGateway instead (see vpc-networking/rgd-subnet.yaml),
# a Deployment with one NIC in the tenant subnet and one here. This subnet is the "external"
# side: it lives in the default VPC, so its own natOutgoing works and gives the gateway a
# real path off the node.
#
# The gateway attaches to it through multus, which is why it needs a
# NetworkAttachmentDefinition and a matching `provider` on the Subnet - an ordinary
# subnet like ovn-default cannot be used and is rejected with
# "please set correct provider of subnet ... to get the network-attachment-definition".
#
# 172.30.0.0/24 was picked to avoid ovn-default (172.16.0.0/16), join (100.64.0.0/16),
# the service CIDR (10.96.0.0/12) and the tenant subnets.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpc-egress-external
  namespace: kube-system
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "kube-ovn",
      "server_socket": "/run/openvswitch/kube-ovn-daemon.sock",
      "provider": "vpc-egress-external.kube-system.ovn"
    }'

---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: vpc-egress-external
spec:
  protocol: IPv4
  cidrBlock: 172.30.0.0/24
  gateway: 172.30.0.1
  excludeIps: ["172.30.0.1"]
  vpc: ovn-cluster
  # Must match the NAD above as <name>.<namespace>.ovn
  provider: vpc-egress-external.kube-system.ovn
  natOutgoing: true
