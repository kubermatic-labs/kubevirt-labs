# Deploy a Windows 10 VM cloned from the on-cluster golden image DataSource.
#
# Namespace placeholders are substituted by the Justfile (`just deploy <namespace>`):
#   __TODO_NAMESPACE__        -> the runtime namespace to deploy into (required)
#   __TODO_BUILD_NAMESPACE__  -> the namespace holding the golden image (default: build-vm-win10)
#
# Render manually with:
#   sed -e 's/__TODO_NAMESPACE__/my-ns/g' -e 's/__TODO_BUILD_NAMESPACE__/build-vm-win10/g' \
#       vm-from-golden-image.yaml | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: __TODO_NAMESPACE__
---
# RBAC: Allow the default SA in __TODO_NAMESPACE__ to clone DataVolumes from vm-images
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cdi-clone-from-vm-images
rules:
- apiGroups: ["cdi.kubevirt.io"]
  resources: ["datavolumes/source"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdi-clone-from-vm-images
  namespace: __TODO_BUILD_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdi-clone-from-vm-images
subjects:
- kind: ServiceAccount
  name: default
  namespace: __TODO_NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  name: win10-demo
  namespace: __TODO_NAMESPACE__
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "win10-demo.tobi.demo.kubermatic.io"
spec:
  # KubeLB's CCM is opt-in - it only publishes Services carrying its class.
  # Without it MetalLB would try, and its pool here is a single address that
  # svc/dashboard already holds. IMMUTABLE: changing it needs a recreate.
  loadBalancerClass: kubelb
  ports:
  - name: rdp
    port: 3389
  - name: http
    port: 80
  selector:
    kubevirt.io/vm: win10-demo
  type: LoadBalancer
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win10-demo
  namespace: __TODO_NAMESPACE__
  labels:
    kubevirt.io/vm: win10-demo
spec:
  # Instance type and preference manage CPU, memory, firmware, Hyper-V, clock, etc.
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.large
  preference:
    kind: VirtualMachineClusterPreference
    name: windows.10.virtio

  # Clone the golden image into a new disk for this VM
  dataVolumeTemplates:
  - metadata:
      name: win10-demo-disk
    spec:
      sourceRef:
        kind: DataSource
        name: windows-10-golden
        namespace: __TODO_BUILD_NAMESPACE__
      storage:
        accessModes:
        - ReadWriteMany
        #- ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: kubev-vms

  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: win10-demo
        kubevirt.io/os: windows10
    spec:
      dnsConfig:
        nameservers:
        - 8.8.8.8
      dnsPolicy: None
      domain:
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: scsi
            bootOrder: 1
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: rootdisk
        dataVolume:
          name: win10-demo-disk
