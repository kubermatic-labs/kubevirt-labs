---
# THE DEDICATED IP: this is what turns the bastion from a virtctl-tunnel-only VM
# into a box you can plain-`ssh` into.
#
# Applied to the KKP routing cluster (kkp-router-cluster / khf59tv58t), NOT to
# the KubeVirt seed:
#
#   KUBECONFIG=$KUBECONFIG_ROUTING_CLUSTER \
#     kubectl apply -f routing-cluster/bastion-svc-lb.yaml
#
# Path a packet takes:
#
#   ssh ubuntu@34.159.197.234:22          <- KubeLB public IP (GCP)
#     -> routing-cluster svc/bastion-vm   (LoadBalancer, nodePort 31610)
#     -> node tobi-demo-router (172.16.16.7), kube-proxy DNAT
#     -> 172.16.15.255:22                 <- the bastion VM on ovn-default
#
# The VM is NOT a pod in this cluster - it lives on the ovn-default pod network
# (172.16.0.0/16) in the KubeVirt seed and is reached by IP. So the Service has
# NO selector and is paired with the MANUAL Endpoints object below.
#
# The VM's address is PINNED (ovn.kubernetes.io/ip_address in bastion-vm.yaml)
# precisely so this hard-coded address cannot go stale. `just publish` re-syncs
# it from the live VM if it ever does.
#
# NOTE: v1 Endpoints is deprecated in k8s 1.33+ (this cluster is 1.34) but still
# served and still honoured by kube-proxy. Migrate to a hand-written
# discovery.k8s.io/v1 EndpointSlice only together with deleting this object -
# running both invites the EndpointSliceMirroring controller to fight you.

apiVersion: v1
kind: Service
metadata:
  name: bastion-vm
  namespace: vm-aas-demo
  annotations:
    # ------------------------------------------------------------------------
    # UNRESOLVED: this LoadBalancer's public IP does NOT forward. Parked, not fixed.
    # ------------------------------------------------------------------------
    demo.k8c.io/known-issue: >-
      KubeLB public IP 34.159.197.234:22 accepts TCP then RSTs with zero bytes
      (~20ms). Confirmed NOT specific to this Service: a control test (plain nginx
      Pod + normal selector-based LoadBalancer, svc kubelb-probe, IP 34.107.22.175)
      failed identically while its clusterIP and nodePort both returned 200. Every
      KubeLB IP on this cluster behaves this way. Not a NetworkPolicy - none exist
      in this cluster or the KubeVirt seed, no Calico GlobalNetworkPolicy or
      HostEndpoint, and ovn-default has private=false with no ACLs. Signature is an
      L4 proxy accepting the client then failing its upstream connect. Hypothesis:
      KubeLB routes to nodeIP:nodePort and this tenant's only node
      (tobi-demo-router) has InternalIP 172.16.16.7, a private kube-ovn address
      inside the KubeVirt seed that a KubeLB envoy in the GCP fog cluster cannot
      route to. NEXT STEP: needs the KubeLB management ("fog") cluster to confirm -
      check the envoy upstream/endpoint config for this tenant.
    demo.k8c.io/known-issue-status: "parked 2026-08-31 - analyse later, not blocking"
    demo.k8c.io/workaround: >-
      Reach the VM over Tailscale instead: ssh ubuntu@100.96.207.39 (MagicDNS
      tobi-demo-bastion.tailbf56ad.ts.net), or `just ssh-ts` in
      hack/demo-setup. Fallback without a tailnet: `just ssh-jump` (socat pod in
      the KubeVirt seed).
spec:
  type: LoadBalancer
  ports:
    - name: ssh
      port: 22          # port the client connects to on the public IP
      targetPort: 22    # port on the VM (172.16.15.255:22)
      protocol: TCP
  # No spec.selector -> no auto-generated Endpoints; we supply them manually below.
---
apiVersion: v1
kind: Endpoints
metadata:
  name: bastion-vm
  namespace: vm-aas-demo
subsets:
  - addresses:
      - ip: 172.16.15.255   # bastion VM, pinned on ovn-default (172.16.0.0/16)
    ports:
      - name: ssh
        port: 22
        protocol: TCP
